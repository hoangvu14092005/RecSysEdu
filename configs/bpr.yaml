# Paths are relative to this YAML. CLI train exports the exact split automatically.
split_dir: ../data/splits/mooccubex-pilot-v1-split-v1
atomic_dir: ../artifacts/recbole
seed: 17
epochs: 10
embedding_size: 64
train_batch_size: 2048
learning_rate: 0.001
# Adapter enforces these settings and rejects split changes after loading:
benchmark_filename: [train, valid, test]
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp
use_gpu: false
