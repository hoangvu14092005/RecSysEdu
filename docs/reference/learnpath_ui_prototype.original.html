  {id:'ds',title:'Cấu trúc dữ liệu và giải thuật',cat:'Khoa học máy tính',tag:'Thuật toán',duration:'12 tuần',short:'DS',color:'linear-gradient(135deg,#6676ef,#8e86ee)',score:.91,cf:.88,content:.94,context:.72,ready:false,missing:['Đệ quy'],reason:'Trùng các chủ đề lập trình và có liên quan tới lịch sử học Python của bạn.',evidence:['Đã đăng ký: Lập trình Python cơ bản','Concept liên quan: Hàm, cấu trúc điều khiển','Tiền đề nên ôn: Đệ quy'],path:[['Lập trình cơ bản','exposed','Có bằng chứng đã tiếp xúc thông qua đăng ký khóa học'],['Đệ quy','missing','Chưa có bằng chứng tiếp xúc với kiến thức này'],['Cấu trúc dữ liệu và giải thuật','target','Khóa học bạn muốn tiếp cận']]},

  {id:'algo',title:'Thiết kế và phân tích thuật toán',cat:'Thuật toán',tag:'Nâng cao',duration:'11 tuần',short:'AL',color:'linear-gradient(135deg,#8e80d9,#b095e7)',score:.79,cf:.85,content:.81,context:.45,ready:false,missing:['Độ phức tạp thuật toán','Cấu trúc dữ liệu'],reason:'Có liên quan đến lĩnh vực yêu thích, nhưng cần củng cố thêm tiền đề.',evidence:['Sở thích liên quan đến thuật toán','Tiền đề nên bổ sung: Cấu trúc dữ liệu'],path:[['Độ phức tạp thuật toán','missing','Chưa có bằng chứng'],['Cấu trúc dữ liệu','missing','Nên học trước'],['Thiết kế và phân tích thuật toán','target','Khóa học mục tiêu']]}
 ]},
 B: {name:'Người học B',area:'Toán ứng dụng',interests:['Phân tích dữ liệu','Thống kê','Machine Learning'],history:['Đại số tuyến tính','Xác suất thống kê','Python cho dữ liệu'],concepts:['Vector và ma trận','Biến ngẫu nhiên','NumPy'],recs:[
  {id:'ml',title:'Nhập môn Machine Learning',cat:'Trí tuệ nhân tạo',tag:'ML',duration:'12 tuần',short:'ML',color:'linear-gradient(135deg,#6676ef,#8e86ee)',score:.92,cf:.88,content:.96,context:.78,ready:false,missing:['Đạo hàm và gradient'],reason:'Phù hợp với lịch sử Toán, Xác suất và Python cho dữ liệu.',evidence:['Đã đăng ký: Đại số tuyến tính','Đã đăng ký: Xác suất thống kê','Concept cần ôn: Gradient'],path:[['Đại số tuyến tính','exposed','Đã đăng ký khóa tương ứng'],['Đạo hàm và gradient','missing','Chưa có bằng chứng'],['Nhập môn Machine Learning','target','Khóa học mục tiêu']]},
  {id:'viz',title:'Trực quan hóa dữ liệu',cat:'Khoa học dữ liệu',tag:'Data',duration:'6 tuần',short:'DV',color:'linear-gradient(135deg,#35b8ba,#6bc9ab)',score:.89,cf:.85,content:.92,context:.90,ready:true,missing:[],reason:'Phù hợp với kiến thức Python cho dữ liệu và chủ đề phân tích dữ liệu.',evidence:['Đã đăng ký: Python cho dữ liệu','Quan tâm: Phân tích dữ liệu'],path:[['Python cho dữ liệu','exposed','Có lịch sử đăng ký'],['Trực quan hóa dữ liệu','target','Mục tiêu học tập']]},
  {id:'stats',title:'Thống kê suy luận',cat:'Toán học',tag:'Thống kê',duration:'9 tuần',short:'ST',color:'linear-gradient(135deg,#e8a36d,#f0c27a)',score:.85,cf:.80,content:.93,context:.85,ready:true,missing:[],reason:'Mở rộng trực tiếp từ các chủ đề Xác suất đã tiếp xúc.',evidence:['Đã đăng ký: Xác suất thống kê','Sở thích: Thống kê'],path:[['Xác suất thống kê','exposed','Từng tiếp xúc'],['Ước lượng và kiểm định','target','Nội dung học'],['Thống kê suy luận','target','Mục tiêu học tập']]},
  {id:'dl',title:'Nhập môn Deep Learning',cat:'Trí tuệ nhân tạo',tag:'AI nâng cao',duration:'13 tuần',short:'DL',color:'linear-gradient(135deg,#a374d2,#bc9bee)',score:.81,cf:.85,content:.89,context:.39,ready:false,missing:['Machine Learning cơ bản','Gradient'],reason:'Phù hợp chủ đề AI, nhưng tiền đề hiện chưa đủ bằng chứng.',evidence:['Quan tâm: Machine Learning','Tiền đề nên bổ sung: ML cơ bản'],path:[['Gradient','missing','Nên học trước'],['Machine Learning cơ bản','missing','Nên học trước'],['Nhập môn Deep Learning','target','Khóa học mục tiêu']]}
 ]}
};
const models = [
 {name:'MostPopular',ndcg:.102,recall:.164,hit:.278,coverage:.17,violations:.39,note:'Sắp xếp khóa học theo độ phổ biến trong tập train.'},
 {name:'Content-based',ndcg:.151,recall:.216,hit:.329,coverage:.52,violations:.34,note:'Sử dụng độ tương đồng giữa nội dung khóa và sở thích người học.'},
 {name:'BPR',ndcg:.178,recall:.264,hit:.386,coverage:.68,violations:.37,note:'Học quan hệ ưu tiên user–course qua implicit interactions.'},
 {name:'Hybrid',ndcg:.201,recall:.291,hit:.412,coverage:.74,violations:.36,note:'Kết hợp Collaborative Filtering và Content-based.'},
 {name:'Hybrid + Prerequisite',ndcg:.196,recall:.281,hit:.399,coverage:.75,violations:.12,note:'Điều chỉnh thứ hạng dựa trên prerequisite; có thể đổi một phần ranking score lấy thứ tự kiến thức hợp lý hơn.'}
];
const menuNames={dashboard:'Tổng quan',recommendations:'Dành cho bạn',path:'Lộ trình học',profile:'Hồ sơ học tập',lab:'Model Lab',dataset:'Dữ liệu & đánh giá'};
let state={page:'recommendations',user:'A',selectedCourse:'ds',filter:'all',goal:'ds',metric:'ndcg',model:'Hybrid + Prerequisite'};
const ico=(n)=>`<svg aria-hidden="true"><use href="#i-${n}"></use></svg>`;
const f=(x)=>Number(x).toFixed(3);
// Synthetic ranking scores for interactive model comparison (NOT trained predictions).
const popularity={ds:.76,db:.94,oop:.88,algo:.70,ml:.78,viz:.92,stats:.89,dl:.73};
function scoreFor(c,model=state.model){
  const m=model;
  if(m==='MostPopular') return popularity[c.id]??.5;
  if(m==='Content-based') return c.content;
  if(m==='BPR') return c.cf;
  if(m==='Hybrid') return .5*c.cf+.5*c.content;
  return Math.max(0,.5*c.cf+.4*c.content+.1*c.context-.025*c.missing.length);
}
const sortedRecs=()=>[...getProfile().recs].sort((a,b)=>scoreFor(b)-scoreFor(a));
function reasonFor(c){
 if(state.model==='MostPopular') return 'Gợi ý dựa trên mức phổ biến của khóa học (giả lập), không cá nhân hóa theo lịch sử.';
 if(state.model==='BPR') return 'Ước lượng quan hệ user–course từ implicit interactions (giả lập).';
 if(state.model==='Content-based') return 'Phù hợp với nội dung và concept tương đồng với hồ sơ quan tâm.';
 if(state.model==='Hybrid') return 'Kết hợp tín hiệu cộng tác và độ phù hợp theo nội dung.';
 return c.reason;
}
function modelSignals(c){
 if(state.model==='MostPopular')return [['Popularity',popularity[c.id]??.5,'']];
 if(state.model==='BPR')return [['Collaborative',c.cf,'']];
 if(state.model==='Content-based')return [['Content-based',c.content,'teal']];
 if(state.model==='Hybrid')return [['Collaborative',c.cf,''],['Content-based',c.content,'teal']];
 return [['Collaborative',c.cf,''],['Content-based',c.content,'teal'],['Prerequisite context',c.context,'orange']];
}
function modelEvidence(c){
 if(state.model==='MostPopular')return ['Tần suất đăng ký trong tập train (dữ liệu giả lập)','Không sử dụng hồ sơ cá nhân để chấm điểm'];
 if(state.model==='BPR')return ['Tín hiệu user–course implicit (dữ liệu giả lập)','Điểm embedding học từ BPR (giả lập)'];
 if(state.model==='Content-based')return ['Đặc trưng content / concept của khóa học','Sở thích/khóa đã đăng ký trong hồ sơ minh họa'];
 return c.evidence;
}
const getProfile=()=>profileData[state.user];
const getCourse=()=>getProfile().recs.find(x=>x.id===state.selectedCourse)||getProfile().recs[0];
const getGoal=()=>getProfile().recs.find(x=>x.id===state.goal)||getProfile().recs[0];
const banner=(title,subtitle)=>`<div class="page-heading"><div><div class="eyebrow">${state.page==='lab'||state.page==='dataset'?'RESEARCH WORKSPACE':'LEARNING PORTAL'}</div><h1>${title}</h1><p>${subtitle}</p></div></div>`;
const foot=()=>`<div class="footer">LearnPath • Interactive UI concept for MOOCCubeX • Hồ sơ, điểm và lộ trình trong prototype đều là minh họa</div>`;
function dashboard(){let p=getProfile(),c=p.recs[0];return `<section class="hero"><div><div class="hero-eyebrow">PERSONALIZED LEARNING EXPERIENCE</div><h1>Xin chào, ${p.name}! 👋<br/>Hôm nay bạn muốn học gì?</h1><p>Khám phá những khóa học được đề xuất từ lịch sử tương tác, chủ đề quan tâm và các quan hệ kiến thức tiên quyết.</p><button class="button white" data-page="recommendations">Khám phá gợi ý ${ico('arrow')}</button></div><div class="hero-art"><div class="orbit">${ico('cap')}</div></div></section>
 <div class="stats-grid"><div class="surface stat"><div class="stat-icon">${ico('book')}</div><div><label>Khóa học đã đăng ký</label><b>${p.history.length}</b></div></div><div class="surface stat"><div class="stat-icon teal">${ico('target')}</div><div><label>Lĩnh vực quan tâm</label><b style="font-size:15px">${p.area}</b></div></div><div class="surface stat"><div class="stat-icon orange">${ico('spark')}</div><div><label>Gợi ý minh họa</label><b>${p.recs.length}</b></div></div></div>
 <div class="two-col"><section class="surface panel"><div class="section-heading"><h2>Tiếp theo bạn có thể học</h2><button class="button small ghost" data-page="recommendations">Xem tất cả ${ico('arrow')}</button></div>${sortedRecs().slice(0,3).map(x=>`<div class="history-row"><div class="course-icon" style="background:${x.color};height:43px;width:43px;border-radius:11px;font-size:12px"><span>${x.short}</span></div><div style="flex:1"><strong>${x.title}</strong><small>${x.cat} • Điểm xếp hạng minh họa ${f(scoreFor(x))}</small></div><button class="button small secondary" data-course="${x.id}">Xem</button></div>`).join('')}</section><section class="surface panel"><div class="section-heading"><h2>Hồ sơ của bạn</h2>${ico('user')}</div><p style="font-size:12px;margin:10px 0 17px">Các tín hiệu hệ thống sử dụng để xây dựng gợi ý.</p><div class="input-label">SỞ THÍCH</div><div class="chips">${p.interests.map(x=>`<span class="chip">${x}</span>`).join('')}</div><div class="details-divider"></div><div class="input-label">KIẾN THỨC ĐÃ CÓ TƯƠNG TÁC</div><div class="chips">${p.concepts.map(x=>`<span class="badge muted">${x}</span>`).join('')}</div><button class="button secondary" style="margin-top:18px;width:100%" data-page="profile">Xem hồ sơ ${ico('arrow')}</button></section></div>${foot()}`}
function recCard(x,i){return `<article class="rec-card ${getCourse().id===x.id?'selected':''}"><div class="rec-top"><div class="course-icon" style="background:${x.color}"><span>${x.short}</span></div><div class="course-info"><div class="meta-line" style="margin-top:0;margin-bottom:5px;font-weight:700;color:#9ea9bd">#${i+1} · ${x.cat}</div><div class="rec-title">${x.title}</div><div class="meta-line">${ico('clock').replace('<svg','<svg style="width:12px;height:12px;vertical-align:-2px;margin-right:2px"')} ${x.duration} · Khóa học minh họa</div><div class="rec-tags"><span class="badge purple">${x.tag}</span><span class="badge ${x.ready?'green':'amber'}">${x.ready?`${ico('check')} Không phát hiện thiếu tiền đề`:`${ico('alert')} Nên ôn ${x.missing.length} tiền đề`}</span></div></div><div class="rec-score"><strong>${f(scoreFor(x))}</strong><small>Điểm gợi ý (demo)</small></div></div><div class="rec-bottom"><div class="reason-inline">${ico('bulb')}<span>${reasonFor(x)}</span></div><div class="rec-actions"><button class="button secondary small" data-course="${x.id}">Giải thích</button><button class="button primary small" data-goal="${x.id}">Lộ trình ${ico('arrow')}</button></div></div></article>`}
function detailPanel(){let c=getCourse();return `<aside class="surface detail-panel"><div class="section-heading" style="margin-bottom:10px"><h3>Vì sao gợi ý?</h3><span class="badge purple">XAI</span></div><div class="mini-title">KHÓA HỌC ĐANG CHỌN</div><h3>${c.title}</h3><p style="font-size:11px">${c.cat}</p><div class="explain-why">${ico('spark')} <span style="margin-left:5px">${reasonFor(c)}</span></div><div class="score-split"><h3 style="font-size:13px">Phân rã điểm minh họa</h3>${modelSignals(c).map(([name,s,color])=>`<div class="score-row"><div class="score-label"><span>${name}</span><b>${f(s)}</b></div><div class="score-track"><div class="score-fill ${color}" style="width:${Math.round(s*100)}%"></div></div></div>`).join('')}</div><div class="details-divider"></div><h3 style="font-size:13px">Bằng chứng sử dụng</h3><ul class="evidence-list">${modelEvidence(c).map(x=>`<li>${ico('check')}<span>${x}</span></li>`).join('')}</ul><div class="panel-note">${ico('info')} Đây là giải thích trên dữ liệu giả định. Điểm mô hình không phải xác suất thành công, và lịch sử đăng ký không chứng minh đã thành thạo.</div><button class="button primary" data-goal="${c.id}" style="margin-top:15px;width:100%">Xem lộ trình cho khóa này ${ico('arrow')}</button></aside>`}
function recommendations(){let p=getProfile();let filtered=sortedRecs().filter(c=>state.filter==='all'||(state.filter==='ready'&&c.ready)||(state.filter==='missing'&&!c.ready));return `${banner('Dành riêng cho bạn ✨','Đề xuất các khóa học phù hợp, kèm lý do gợi ý và những kiến thức nên học trước.')}<div class="rec-layout"><section><div class="rec-controls"><div class="seg-tabs"><button class="seg-btn ${state.filter==='all'?'active':''}" data-filter="all">Tất cả (${p.recs.length})</button><button class="seg-btn ${state.filter==='ready'?'active':''}" data-filter="ready">Có thể bắt đầu</button><button class="seg-btn ${state.filter==='missing'?'active':''}" data-filter="missing">Cần tiền đề</button></div><span class="caption">${state.model} • Top-K minh họa</span></div><div class="rec-stack">${filtered.length?filtered.map((x,i)=>recCard(x,i)).join(''):'<div class="surface empty">Chưa có khóa học phù hợp với bộ lọc đang chọn.</div>'}</div><div style="margin-top:15px" class="caption">Đổi mô hình trong Model Lab để xem thứ hạng thay đổi. Khi tích hợp mô hình thật, điểm, thứ hạng, prerequisite và lý do giải thích phải lấy từ backend, không viết cứng trong giao diện.</div></section>${detailPanel()}</div>${foot()}`}
function path(){let p=getProfile(),c=getGoal();return `${banner('Lộ trình học tập 🗺️','Đi từ kiến thức nền đến mục tiêu, ưu tiên các quan hệ prerequisite đã kiểm chứng.')}<div class="path-hero"><section class="surface goal-picker"><label class="input-label" for="goalSelect">CHỌN KHÓA HỌC MỤC TIÊU</label><select id="goalSelect" class="field">${p.recs.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.title}</option>`).join('')}</select><p style="font-size:11px;margin-top:11px">Lộ trình thay đổi theo khóa học được chọn và hồ sơ người học hiện tại.</p></section><section class="surface goal-picker" style="display:flex;gap:12px;align-items:center"><div class="stat-icon teal">${ico('route')}</div><div><div class="input-label" style="margin:0">BƯỚC TRONG LỘ TRÌNH</div><div style="font-size:27px;font-weight:850">${c.path.length}</div><div class="caption">Bước mô phỏng, không phải dự báo thời gian học</div></div></section></div><div class="path-main"><section class="surface path-panel"><div class="section-heading"><h2>Knowledge Learning Path</h2><span class="badge purple">Concept graph • Demo</span></div><p style="font-size:12px;margin:2px 0 23px">Thứ tự học được trình bày từ các concept tiền đề đến mục tiêu.</p>${c.path.map(([name,status,description],i)=>`<div class="path-node"><div class="path-rail"><div class="path-node-circle ${status}">${status==='exposed'?ico('check'):status==='target'?ico('target'):(i+1)}</div>${i<c.path.length-1?'<div class="path-node-line"></div>':''}</div><div class="path-node-content"><strong>${name}</strong><p>${description}</p><span class="badge ${status==='exposed'?'green':status==='missing'?'amber':'purple'}">${status==='exposed'?'Từng tiếp xúc':status==='missing'?'Cần kiểm tra/ôn tập':'Mục tiêu'}</span></div></div>`).join('')}</section><aside class="surface path-panel"><h3>Chú giải trạng thái</h3><div style="margin-top:15px"><div class="legend"><span class="legend-mark"></span>Từng tiếp xúc (qua tương tác)</div><div class="legend"><span class="legend-mark missing"></span>Thiếu bằng chứng / nên ôn</div><div class="legend"><span class="legend-mark target"></span>Mục tiêu học tập</div></div><div class="details-divider"></div><h3 style="margin-bottom:10px">Cách hệ thống suy luận</h3><p style="font-size:12px;line-height:1.8">1. Đọc các concept của khóa mục tiêu.<br/>2. Truy vấn các prerequisite từ concept graph.<br/>3. Đối chiếu lịch sử tương tác.<br/>4. Sắp xếp thứ tự học theo graph.</p><div class="panel-note">Đây là trình tự minh họa, chưa được sinh bằng graph MOOCCubeX thật. Không suy diễn năng lực từ mỗi lượt đăng ký.</div><button class="button secondary" style="width:100%;margin-top:15px" data-page="recommendations">${ico('arrow')} Trở lại gợi ý</button></aside></div>${foot()}`}
function profile(){let p=getProfile();return `${banner('Hồ sơ học tập','Tổng hợp lịch sử đăng ký, lĩnh vực quan tâm và các khái niệm từng tiếp xúc.')}<div class="stats-grid"><div class="surface stat"><div class="stat-icon">${ico('book')}</div><div><label>Khóa đã đăng ký</label><b>${p.history.length}</b></div></div><div class="surface stat"><div class="stat-icon teal">${ico('layers')}</div><div><label>Concept minh họa</label><b>${p.concepts.length}</b></div></div><div class="surface stat"><div class="stat-icon orange">${ico('target')}</div><div><label>Khóa đề xuất mẫu</label><b>${p.recs.length}</b></div></div></div><div class="two-col"><section class="surface panel"><div class="section-heading"><h2>Lịch sử đăng ký khóa học</h2><span class="badge muted">Implicit feedback</span></div>${p.history.map((name,i)=>`<div class="history-row"><div class="history-icon">${ico('book')}</div><div style="flex:1"><strong>${name}</strong><small>Bản ghi minh họa #${i+1} · Trạng thái: đã đăng ký</small></div>${ico('check')}</div>`).join('')}</section><section class="surface panel"><h2>Thông tin quan tâm</h2><div class="input-label" style="margin-top:19px">LĨNH VỰC CHÍNH</div><div class="chips"><span class="chip">${p.area}</span></div><div class="input-label" style="margin-top:20px">SỞ THÍCH</div><div class="chips">${p.interests.map(x=>`<span class="chip">${x}</span>`).join('')}</div><div class="input-label" style="margin-top:20px">CONCEPT LIÊN QUAN ĐẾN TƯƠNG TÁC</div><div class="chips">${p.concepts.map(x=>`<span class="badge muted">${x}</span>`).join('')}</div></section></div><div class="info-banner" style="margin-top:19px">${ico('info')} <strong>Nguyên tắc dữ liệu:</strong> Đã đăng ký khóa học không đồng nghĩa với đã hoàn thành hoặc thành thạo. Chỉ hiển thị trạng thái hoàn thành nếu pipeline có bằng chứng từ bài tập, kết quả hoặc hoạt động phù hợp.</div>${foot()}`}
function lab(){let metricLabel={ndcg:'NDCG@10',recall:'Recall@10',hit:'HitRate@10',coverage:'Coverage'};let max=Math.max(...models.map(x=>x[state.metric]));let selected=models.find(x=>x.name===state.model);return `${banner('Model Lab 🔬','Không gian kiểm chứng mô hình cho giảng viên và nhóm thực hiện đồ án.')}<div class="lab-ribbon">${ico('alert')} <span><strong>SỐ LIỆU MÔ PHỎNG:</strong> Toàn bộ metric và mức vi phạm prerequisite bên dưới được đặt giả định để thử giao diện; không phải kết quả huấn luyện MOOCCubeX.</span></div><div class="stats-grid"><div class="surface stat"><div class="stat-icon">${ico('grid')}</div><div><label>Algorithms</label><b>5</b></div></div><div class="surface stat"><div class="stat-icon teal">${ico('chart')}</div><div><label>Ranking metrics</label><b>4</b></div></div><div class="surface stat"><div class="stat-icon orange">${ico('target')}</div><div><label>Evaluation protocol</label><b style="font-size:15px">Chronological</b></div></div></div><div class="lab-grid"><section class="surface panel"><div class="section-heading" style="align-items:flex-start;gap:16px"><div><h2>Model comparison</h2><p style="font-size:11px;margin-top:4px">So sánh cùng một thước đo trên bộ test (số liệu giả lập)</p></div></div><div class="metric-tabs">${Object.keys(metricLabel).map(m=>`<button data-metric="${m}" class="${state.metric===m?'active':''}">${metricLabel[m]}</button>`).join('')}</div>${models.map(m=>`<div class="bar-item"><div class="bar-head"><strong style="${m.name===state.model?'color:var(--indigo)':''}">${m.name}</strong><span style="font-variant-numeric:tabular-nums">${f(m[state.metric])}</span></div><div class="chart-bar"><div class="${m.name===state.model?'featured':''}" style="width:${(m[state.metric]/max*100).toFixed(1)}%"></div></div></div>`).join('')}<div class="caption" style="margin-top:23px">Chênh lệch metric trong prototype không phải bằng chứng mô hình nào tốt hơn.</div></section><aside class="surface panel"><h2>Chi tiết mô hình</h2><p style="font-size:11px;margin:7px 0 15px">Chọn một thuật toán để xem mục tiêu và chỉ số minh họa.</p><div class="model-list">${models.map(m=>`<button class="model-option ${state.model===m.name?'active':''}" data-model="${m.name}"><span>${m.name}<small>${m.name==='Hybrid + Prerequisite'?'Hybrid reranking':m.name==='BPR'?'Collaborative Filtering':'Recommender model'}</small></span>${state.model===m.name?ico('check'):ico('arrow')}</button>`).join('')}</div><div class="details-divider"></div><h3 style="font-size:13px">${selected.name}</h3><p style="font-size:11px;margin-top:7px">${selected.note}</p><div class="note-box" style="margin-top:12px">${metricLabel[state.metric]}: <strong>${f(selected[state.metric])}</strong> (giả lập)<br/>Prerequisite thiếu ước lượng: <strong>${Math.round(selected.violations*100)}%</strong> (giả lập)</div></aside></div><section class="surface panel" style="margin-top:20px"><div class="section-heading"><h2>Bảng kết quả offline</h2><button class="button secondary small" data-export="metrics">${ico('download')} Xuất CSV demo</button></div><div class="lab-table-wrap"><table class="lab-table"><thead><tr><th>MODEL</th><th>NDCG@10</th><th>RECALL@10</th><th>HITRATE@10</th><th>COVERAGE</th><th>THIẾU TIỀN ĐỀ*</th></tr></thead><tbody>${models.map(m=>`<tr class="${m.name==='Hybrid + Prerequisite'?'highlight':''}"><td><strong>${m.name}</strong></td><td class="value">${f(m.ndcg)}</td><td class="value">${f(m.recall)}</td><td class="value">${f(m.hit)}</td><td class="value">${f(m.coverage)}</td><td class="value">${Math.round(m.violations*100)}%</td></tr>`).join('')}</tbody></table></div><div class="caption" style="margin-top:12px">* Chỉ số phụ về tỷ lệ prerequisite chưa đáp ứng theo proxy, định nghĩa phải công bố khi đánh giá trên dữ liệu thật.</div></section><div class="two-col" style="margin-top:20px"><section class="surface panel"><div class="section-heading"><h2>Ablation study</h2><span class="badge purple">Research Question 3</span></div><p style="font-size:12px;margin-bottom:16px">Giả lập trade-off khi thêm prerequisite-aware reranking.</p><div class="ablation"><div class="abl-card"><small style="color:#8b9bb2">Hybrid</small><p>Thiếu prerequisite</p><strong>36%</strong></div><div class="abl-card" style="background:#ecf8f3"><small style="color:#4da38a">Hybrid + Prerequisite</small><p>Thiếu prerequisite</p><strong style="color:#16866e">12%</strong></div></div><div class="caption" style="margin-top:12px">Không diễn giải tỷ lệ này là hiệu quả thực tế nếu chưa đo trên graph đã làm sạch.</div></section><section class="surface panel"><div class="section-heading"><h2>Case study cá nhân hóa</h2><span class="badge purple">Demo Flow</span></div><p style="font-size:12px;margin-bottom:14px">Dùng cùng hồ sơ mẫu ở thanh trên để so sánh thứ hạng và giải thích khi có kết quả từ từng thuật toán.</p><div class="note-box" style="margin-bottom:14px"><strong>Hồ sơ đang chọn:</strong> ${getProfile().name}<br/><strong>Domain:</strong> ${getProfile().area}<br/><strong>Điểm cần đối chiếu:</strong> thay đổi Top-K và prerequisite.</div><button class="button primary" data-page="recommendations" style="width:100%">Xem gợi ý của hồ sơ này ${ico('arrow')}</button></section></div>${foot()}`}
function dataset(){return `${banner('Dữ liệu & đánh giá','Trang trạng thái kết nối và nguyên tắc đánh giá — không tự nhận số liệu xử lý khi chưa chạy pipeline.')}<div class="stats-grid"><div class="surface stat"><div class="stat-icon">${ico('user')}</div><div><label>Người học công bố*</label><b>3,330,294</b></div></div><div class="surface stat"><div class="stat-icon teal">${ico('book')}</div><div><label>Khóa học công bố*</label><b>4,216</b></div></div><div class="surface stat"><div class="stat-icon orange">${ico('layers')}</div><div><label>Fine-grained concepts*</label><b>637,572</b></div></div></div><div class="two-col"><section class="surface panel"><div class="section-heading"><h2>Pipeline từ dữ liệu tới giao diện</h2><span class="badge purple">Reuse-first</span></div>${[['MOOCCubeX','Course / user / interaction / concept / prerequisite'],['Preprocessing','Làm sạch ID, domain filtering, chuẩn hóa interaction'],['Offline evaluation','MostPopular / Content / BPR / Hybrid / Rerank'],['API layer','Cung cấp danh sách Top-K, explanations, learning path'],['LearnPath UI','Cùng dữ liệu phục vụ Student Portal và Model Lab']].map(([title,desc],i)=>`<div class="data-step"><div class="step-no">${i+1}</div><div><strong>${title}</strong><p>${desc}</p></div>${ico('arrow')}</div>`).join('')}</section><section class="surface panel"><h2>Data quality checklist</h2><p style="font-size:12px;margin:8px 0 17px">Các kiểm tra phải hoàn tất trước khi công bố kết quả thật.</p>${['Tỷ lệ user–course ID ánh xạ được','Tính hợp lệ của timestamp','Sparsity và độ dài lịch sử người học','Train / valid / test không leakage','Tính hợp lệ và chu trình của prerequisite graph','Hiệu quả theo user ít/nhiều tương tác'].map(x=>`<div class="history-row"><div class="history-icon" style="background:#fff4e7;color:#b6894e">${ico('clock')}</div><div style="flex:1"><strong>${x}</strong><small>Chờ kết nối preprocessing / evaluation</small></div></div>`).join('')}</section></div><div class="info-banner" style="margin-top:19px"><strong>* Quy mô công bố:</strong> lấy từ bản đề xuất đề tài dựa trên MOOCCubeX. Đây không phải số lượng bản ghi mà prototype đã nạp hoặc nhóm đã huấn luyện.</div>${foot()}`}
function render(){document.getElementById('breadcrumb').textContent=menuNames[state.page];document.getElementById('avatar').textContent=state.user;document.getElementById('profileSelect').value=state.user;document.querySelectorAll('.nav-btn').forEach(b=>{let active=b.dataset.page===state.page;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false')});let markup=({dashboard, recommendations, path, profile, lab, dataset})[state.page]();document.getElementById('pageRoot').innerHTML=markup}
let toastTimer;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('visible'),2600)}
function navigate(page){if(!menuNames[page])return;state.page=page;document.getElementById('sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'})}
function exportDemo(){let rows=[['model','ndcg_at_10','recall_at_10','hitrate_at_10','coverage','estimated_missing_prerequisite_rate','data_kind'],...models.map(m=>[m.name,m.ndcg,m.recall,m.hit,m.coverage,m.violations,'SYNTHETIC_UI_DEMO'])];let csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');let a=document.createElement('a');let url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));a.href=url;a.download='learnpath_SIMULATED_metrics.csv';a.click();URL.revokeObjectURL(url);toast('Đã xuất CSV dữ liệu mô phỏng.');}
document.addEventListener('click',e=>{const btn=e.target.closest('button[data-page],button[data-filter],button[data-course],button[data-goal],button[data-metric],button[data-model],button[data-export]');if(!btn)return;if(btn.dataset.page){navigate(btn.dataset.page);return}if(btn.dataset.filter){state.filter=btn.dataset.filter;render();return}if(btn.dataset.course){state.selectedCourse=btn.dataset.course;navigate('recommendations');return}if(btn.dataset.goal){state.goal=btn.dataset.goal;navigate('path');return}if(btn.dataset.metric){state.metric=btn.dataset.metric;render();return}if(btn.dataset.model){state.model=btn.dataset.model;render();return}if(btn.dataset.export){exportDemo();return}});
document.getElementById('profileSelect').addEventListener('change',e=>{state.user=e.target.value;state.selectedCourse=getProfile().recs[0].id;state.goal=getProfile().recs[0].id;state.filter='all';render();toast('Đã chuyển sang '+getProfile().name+' (dữ liệu minh họa).')});
document.getElementById('pageRoot').addEventListener('change',e=>{if(e.target.id==='goalSelect'){state.goal=e.target.value;render()}});
document.getElementById('mobileMenu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('sidebar').classList.remove('open')});
render();
</script>
</body>
</html>
