[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recsysedu"
version = "0.1.0"
description = "LearnPath: reproducible MOOCCubeX course recommendation project"
requires-python = ">=3.10"
dependencies = ["ijson>=3.3,<4", "numpy>=1.26,<3", "pandas>=2.2,<3", "PyYAML>=6,<7", "scikit-learn>=1.5,<2", "scipy>=1.8,<2", "joblib>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
demo = ["streamlit>=1.44,<2"]
data = ["duckdb>=1.4,<2", "pyarrow>=15"]

[project.scripts]
recsysedu = "recsysedu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
